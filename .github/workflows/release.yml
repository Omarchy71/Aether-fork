name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.7.0)'
        required: true
        default: '1.7.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.15729638" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version name
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Build debug APKs
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build_output.log

      - name: Report build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Find and organize APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$RELEASE_DIR"

          echo "## Finding APKs" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -name "*.apk" -type f 2>&1 | while read apk; do
            BASENAME=$(basename "$apk")
            if [[ "$BASENAME" == *"universal"* ]]; then
              NEW_NAME="AetherY-${VERSION}-universal.apk"
            elif [[ "$BASENAME" == *"arm64-v8a"* ]]; then
              NEW_NAME="AetherY-${VERSION}-arm64-v8a.apk"
            elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
              NEW_NAME="AetherY-${VERSION}-armeabi-v7a.apk"
            elif [[ "$BASENAME" == *"x86_64"* ]]; then
              NEW_NAME="AetherY-${VERSION}-x86_64.apk"
            else
              NEW_NAME="AetherY-${VERSION}-${BASENAME}"
            fi
            cp "$apk" "$RELEASE_DIR/$NEW_NAME"
            echo "  $apk -> $NEW_NAME"
            echo "- $NEW_NAME" >> $GITHUB_STEP_SUMMARY
          done

          APK_COUNT=$(ls "$RELEASE_DIR"/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "## WARNING: No APKs found!" >> $GITHUB_STEP_SUMMARY
            echo "Checking all build outputs:" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f >> $GITHUB_STEP_SUMMARY || echo "None found"
            echo "Build outputs directory:" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs -type f >> $GITHUB_STEP_SUMMARY || echo "No outputs dir"
          fi

          ls -la "$RELEASE_DIR/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AetherY v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
