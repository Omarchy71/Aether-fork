name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.7.0)'
        required: true
        default: '1.7.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.15729638" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version name
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Debug APK output
        run: |
          echo "## APK output tree" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -type f >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No outputs found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Collect APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$RELEASE_DIR"

          find app/build/outputs -name "*.apk" -type f | while read apk; do
            BASENAME=$(basename "$apk")
            if [[ "$BASENAME" == *"universal"* ]]; then
              NEW_NAME="AetherY-${VERSION}-universal.apk"
            elif [[ "$BASENAME" == *"arm64-v8a"* ]]; then
              NEW_NAME="AetherY-${VERSION}-arm64-v8a.apk"
            elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
              NEW_NAME="AetherY-${VERSION}-armeabi-v7a.apk"
            elif [[ "$BASENAME" == *"x86_64"* ]]; then
              NEW_NAME="AetherY-${VERSION}-x86_64.apk"
            else
              NEW_NAME="AetherY-${VERSION}-${BASENAME}"
            fi
            cp "$apk" "$RELEASE_DIR/$NEW_NAME"
            echo "Copied: $NEW_NAME"
          done

          echo "## Release artifacts" >> $GITHUB_STEP_SUMMARY
          ls -la "$RELEASE_DIR/" >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AetherY v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
